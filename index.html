    <meta name="description" id="metaDescription"  content="Purchase your exclusive membership">
    <meta name="theme-color" content="#25D366">
    <!-- Preconnect to WhatsApp domain for faster redirect -->
    <link rel="preconnect" href="https://wa.me">
    
    <title id="pageTitle">Loco Otro - Purchase Membership</title>
    
    <!-- Early brand detection to update meta tags before paint -->
    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var brand = params.get('brand');
            var themeColor = params.get('theme'); // Optional: custom theme color
            
            if (brand) {
                brand = decodeURIComponent(brand);
                document.getElementById('metaDescription').content = 'Purchase your exclusive membership for ' + brand;
                document.getElementById('pageTitle').textContent = brand + ' – Purchase Membership';
                
                // Store for later use in body script
                window.__BRAND_NAME__ = brand;
            }
            
            if (themeColor) {
                document.getElementById('themeColor').content = '#' + themeColor;
                window.__THEME_COLOR__ = '#' + themeColor;
            }
        })();
    </script>

                    code: '+52',
                    flag: '🇲🇽',
                    length: 10,
                    pattern: /^[1-9]\d{9}$/,
                    placeholder: '5512345678',
                    hint: 'Enter your 10-digit mobile number',
                    errorMsg: 'Mexican mobile numbers must be 10 digits',
                    cleanPrefix: function(num) {
                        // Remove leading 1 if present (old format)
                        if (num.length === 11 && num.startsWith('1')) return num.substring(1);
                        return num;
                    }
                }
            };

            // Configuration
            const CONFIG = {
                waNumber: '8484022983',
                countryCode: '+91'
            };
            
            // Parse URL for offer code and optional brand info
            const url = new URL(window.location.href);
            const pathParts = window.location.pathname.split('/').filter(Boolean);
            const offerCode = url.searchParams.get('offer');
            
            // Brand customization via URL params
            const brandName = url.searchParams.get('brand');
            const brandLogo = url.searchParams.get('logo');
            const waNumber = CONFIG.countryCode + (url.searchParams.get('waNumber') || CONFIG.waNumber);
            
            // Update brand display
            const brandEl = document.getElementById('brandLogo');
            if (brandLogo) {
                const img = document.createElement('img');
                img.src = decodeURIComponent(brandLogo);
                img.alt = brandName || 'Brand logo';
                img.className = 'brand-logo';
                img.width = 180;
                img.height = 56;
                img.fetchPriority = 'high';
                brandEl.replaceWith(img);
            } else if (brandName) {
                brandEl.textContent = decodeURIComponent(brandName);
                brandEl.setAttribute('aria-label', decodeURIComponent(brandName) + ' logo');
            }
            
            // Validate mobile number based on country
            function validateMobile(number, countryCode) {
                var country = COUNTRIES[countryCode];
                if (!country) {
                    return { valid: false, error: 'Invalid country selected', cleaned: null };
                }
                
                var cleaned = number.replace(/[\s\-\(\)\.]/g, '');
                
                // Remove country code if user included it
                var dialCode = country.code.replace('+', '');
                if (cleaned.startsWith('+' + dialCode)) {
                    cleaned = cleaned.substring(dialCode.length + 1);
                } else if (cleaned.startsWith(dialCode) && cleaned.length > (Array.isArray(country.length) ? Math.max(...country.length) : country.length) + dialCode.length - 1) {
                    cleaned = cleaned.substring(dialCode.length);
                }
                
                // Apply country-specific prefix cleaning (e.g., remove leading 0)
                cleaned = country.cleanPrefix(cleaned);
                
                if (!cleaned) {
                    return { valid: false, error: 'Please enter your mobile number', cleaned: null };
                }
                
                if (!/^\d+$/.test(cleaned)) {
                    return { valid: false, error: 'Mobile number should contain only digits', cleaned: null };
                }
                
                // Check length
                var validLength = Array.isArray(country.length) 
                    ? country.length.includes(cleaned.length)
                    : cleaned.length === country.length;
                    
                if (!validLength) {
                    var expectedLength = Array.isArray(country.length) 
                        ? country.length.join('-') + ' digits'
                        : country.length + ' digits';
                    return { 
                        valid: false, 
                        error: 'Please enter a ' + expectedLength + ' mobile number',
                        cleaned: null 
                    };
                }
                
                // Check pattern
                if (!country.pattern.test(cleaned)) {
                    return { valid: false, error: country.errorMsg, cleaned: null };
                }
                
                // Reject obvious fake patterns
                if (/^(\d)\1+$/.test(cleaned)) {
                    return { valid: false, error: 'Please enter a valid mobile number', cleaned: null };
                }
                
                return { valid: true, error: null, cleaned: cleaned };
            }
            
            // DOM elements
            var form = document.getElementById('membershipForm');
            var countrySelect = document.getElementById('country');
            var countryCodeDisplay = document.getElementById('countryCode');
            var mobileInput = document.getElementById('mobile');
            var mobileHint = document.getElementById('mobileHint');
            var errorMessage = document.getElementById('mobileError');
            var errorText = document.getElementById('errorText');
            var submitBtn = document.getElementById('submitBtn');
            
            // Update UI when country changes
            function updateCountryUI() {
                var country = COUNTRIES[countrySelect.value];
                countryCodeDisplay.textContent = country.flag + ' ' + country.code;
                countryCodeDisplay.setAttribute('aria-label', country.name + ' country code ' + country.code);
                mobileInput.placeholder = country.placeholder;
                mobileHint.textContent = country.hint;
                mobileInput.value = '';
                setError(false);
            }
            
            countrySelect.addEventListener('change', updateCountryUI);
            
            function setError(show, message) {
                mobileInput.classList.toggle('error', show);
                errorMessage.classList.toggle('visible', show);
                if (message) {
                    errorText.textContent = message;
                }
            }
            
            // Filter input to digits only
            mobileInput.addEventListener('input', function(e) {
                e.target.value = e.target.value.replace(/\D/g, '');
                if (errorMessage.classList.contains('visible')) {
                    setError(false);
                }
            });
            
            // Form submission
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                var mobile = mobileInput.value.trim();
                var selectedCountry = countrySelect.value;
                var validation = validateMobile(mobile, selectedCountry);
                
                if (!validation.valid) {
                    setError(true, validation.error);
                    mobileInput.focus();
                    return;
                }
                
                // Disable button to prevent double-submit
                submitBtn.disabled = true;
                submitBtn.querySelector('span').textContent = 'Redirecting...';
                
                var country = COUNTRIES[selectedCountry];
                var userMobile = country.code + validation.cleaned;
                // Build WhatsApp URL
                const message = '/pay ' + offerCode + ' ' + userMobile;
                const waUrl = 'https://wa.me/' + waNumber + '?text=' + encodeURIComponent(message);
                
                // Redirect
                window.location.href = waUrl;
            });
            
            // Initialize
            updateCountryUI();

            // Focus input on load for better UX
            if (window.innerWidth > 768) {
                mobileInput.focus();
            }
        })();
    </script>
</body>
</html>
